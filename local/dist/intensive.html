<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用自己的文章精读</title><link rel="stylesheet" href="reading.css"><style>select{font:inherit;padding:10px;max-width:100%}.saved button{display:block;width:100%;text-align:left;margin:8px 0}.result-text{white-space:pre-wrap}.entry{max-width:760px}.entry textarea{margin:12px 0}.error{color:#923c29}button:disabled{opacity:.5;cursor:wait}[hidden]{display:none!important}</style></head><body><header class="top"><a href="index.html">← 学习首页</a><a href="reading.html">查看 Lina 示例</a></header><main><h1>用自己的文章精读</h1><p>英语讲清楚，需要时再展开中文。</p><p id="connection" role="status">正在检查本机服务…</p><section class="entry"><form id="generate"><label for="language">原文语言</label> <select id="language"><option>德语</option><option>英语</option><option>日语</option><option>法语</option><option>西班牙语</option><option>其他</option></select><p><label for="text">粘贴原文 · 10–3000 字符，建议先用 3–8 句试学</label></p><textarea id="text" required minlength="10" maxlength="3000" rows="7"></textarea><p class="notice">点击生成会把这篇原文发送给 DeepSeek，并消耗你的 API 额度。请勿输入隐私资料。相同内容与语言优先读取已保存结果，不自动重试。</p><button id="submit" type="submit">发送给 DeepSeek，生成精读</button></form><p id="message" role="status" aria-live="polite"></p></section><section class="saved"><h2>已保存的精读</h2><button id="refresh">刷新列表（不调用 AI）</button><div id="saved"></div></section><section id="result" hidden><div class="tools"><button id="export">导出原文与精读 JSON</button><button id="continue">继续上次阅读</button></div><p class="notice">AI 生成，可能有误。例句是练习参考，不是自动评分；不确定的讲解请核实。</p><h2 id="title"></h2><div class="workspace"><aside class="source"><h2>原文</h2><p id="original" class="result-text"></p></aside><div class="lesson" id="explanation"></div></div><section class="practice"><label for="practice">我的练习与笔记（自动保存在当前浏览器）</label><textarea id="practice" rows="5"></textarea><p id="practice-status" role="status"></p></section></section></main><script src="intensive.js"></script></body></html>
