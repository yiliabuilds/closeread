<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用自己的文章精读</title><link rel="stylesheet" href="reading.css"><style>select{font:inherit;padding:10px;max-width:100%}.saved button{display:block;width:100%;text-align:left;margin:8px 0}.result-text{white-space:pre-wrap}.entry{max-width:760px}.entry textarea{margin:12px 0}.error{color:#923c29}button:disabled{opacity:.5;cursor:wait}[hidden]{display:none!important}
/* Library-only visual theme; reading and generation layouts remain independent. */
body.library-theme{--paper:#f6f7f9;--ink:#284b72;--muted:#64748b;--line:#d4dde7;background:var(--paper);color:#263b53;font-family:"PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.library-theme .top{background:var(--paper);min-height:80px;font-size:14px}
.library-theme a{color:#315780;text-decoration:none}.library-theme a:hover{color:#193b62}
.library-theme main.library-main{max-width:1040px;padding:54px 40px 90px}
.library-theme h1{font-size:32px;font-weight:500;color:#284b72;letter-spacing:0}
.library-theme .page-actions{margin:24px 0 28px;gap:24px}
.library-theme .page-actions a{border:0;border-radius:3px;padding:10px 0;font-size:14px}
.library-theme .page-actions a.main-action{border:1px solid #8ca6c0;padding:10px 20px;color:#315780;background:transparent;margin-left:auto}
.library-theme #connection,.library-theme main>p{font-size:14px;color:var(--muted)}
.library-theme .saved{margin-top:40px}.library-theme .saved>h2{font-size:18px;font-weight:500;margin-bottom:24px}
.library-theme .saved>label{font-size:14px;color:var(--muted)}
.library-theme .library-search{border:0;border-bottom:1px solid #8ca6c0;border-radius:0;background:transparent;padding:14px 0;color:#263b53;margin:6px 0 12px}
.library-theme button{border-radius:3px;background:transparent;font-family:inherit}
.library-theme button:hover{background:#eaf0f7}
.library-theme .saved #refresh{display:inline-block;width:auto;border:0;padding:8px 0;font-size:14px;color:var(--muted);margin:0}
.library-theme #library-management{justify-content:flex-end;margin:0 0 18px}
.library-theme #library-management button{border-color:var(--line);font-weight:400}
.library-theme #article-count{font-size:14px;color:var(--muted)}
.library-theme .article-row{border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:16px 0;margin:0;gap:16px}
.library-theme .article-row.is-selected{background:#eaf0f7;border-color:#b4c3d2}
.library-theme .article-link{padding:16px 8px 16px 0;font-size:18px;line-height:1.8;color:#263b53}
.library-theme .article-row:hover{background:#f0f3f7}
.library-theme .article-trash:hover{background:#f7e9e8;color:#9a4942}
.library-theme :is(button,a,input):focus-visible{outline:2px solid #6e8eaf;outline-offset:4px}
@media(max-width:760px){.library-theme main.library-main{padding:30px 20px 60px}.library-theme h1{font-size:27px}.library-theme .top{min-height:64px}.library-theme .article-link{font-size:16px}.library-theme .page-actions{gap:12px}.library-theme .saved{margin-top:30px}}

.library-theme main.library-main{padding-top:36px}
.library-theme .page-actions{margin:16px 0}.library-theme .saved{margin-top:26px}
.library-theme .saved>h2{margin:0 0 16px}
.library-theme .saved>label{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.library-theme #library-management{margin:-44px 0 12px;min-height:44px;padding-left:190px}
.library-theme .saved>p:empty{display:none}
.library-theme #article-count{display:block;margin:12px 0}
@media(max-width:480px){.library-theme #library-management{padding-left:0;margin:8px 0}.library-theme .saved{margin-top:22px}}
</style><link rel="stylesheet" href="theme.css"></head><body><header class="top"><a href="index.html">← 学习首页</a><a href="reading.html">查看 Lina 示例</a></header><main><h1>用自己的文章精读</h1><p>英语讲清楚，需要时再展开中文。</p><p id="connection" role="status">正在检查本机服务…</p><section class="entry"><form id="generate"><label for="language">原文语言</label> <select id="language"><option>德语</option><option>英语</option><option>日语</option><option>法语</option><option>西班牙语</option><option>其他</option></select><p><label for="text">粘贴原文 · 10–3000 字符，建议先用 3–8 句试学</label></p><textarea id="text" required minlength="10" maxlength="3000" rows="7"></textarea><p class="notice">点击生成会把这篇原文发送给 DeepSeek，并消耗你的 API 额度。请勿输入隐私资料。相同内容与语言优先读取已保存结果，不自动重试。</p><button id="submit" type="submit">发送给 DeepSeek，生成精读</button></form><p id="message" role="status" aria-live="polite"></p></section><section class="saved"><h2>已保存的精读</h2><button id="refresh">刷新列表（不调用 AI）</button><div id="saved"></div></section><section id="result" hidden><div class="tools"><button id="export">导出原文与精读 JSON</button><button id="continue">继续上次阅读</button></div><p class="notice">AI 生成，可能有误。例句是练习参考，不是自动评分；不确定的讲解请核实。</p><h2 id="title"></h2><div class="workspace"><aside class="source"><h2>原文</h2><p id="original" class="result-text"></p></aside><div class="lesson" id="explanation"></div></div><section class="practice"><label for="practice">我的练习与笔记（自动保存在当前浏览器）</label><textarea id="practice" rows="5"></textarea><p id="practice-status" role="status"></p></section></section></main><script src="data-client.js"></script><script src="intensive.js"></script><script src="word-lookup.js"></script></body></html>
